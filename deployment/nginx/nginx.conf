user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Upstream definitions
  upstream frontend {
    server signage-frontend:3000;
  }

  upstream backend {
    server signage-backend:3001;
  }

  # Main server block
  server {
    listen 80 default_server;
    server_name _;

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;

    # Backend API routes — proxy to NestJS backend
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
    }

    # WebSocket support for Socket.IO (both frontend and backend)
    location ~ ^/(socket.io|ws) {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    # Uploads directory
    location /uploads/ {
      proxy_pass http://backend;
    }

    # Static Next.js assets
    location /_next/ {
      proxy_pass http://frontend;
      proxy_cache_bypass $http_upgrade;
    }

    # Next.js public directory
    location /public/ {
      proxy_pass http://frontend;
      proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint (for orchestrators)
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # Everything else to frontend (Next.js)
    location / {
      proxy_pass http://frontend;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Deny access to sensitive files
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }
  }

  # Optional HTTPS server block (uncomment and add certificates for SSL)
  # server {
  #   listen 443 ssl http2;
  #   server_name _;
  #
  #   ssl_certificate /etc/nginx/certs/cert.pem;
  #   ssl_certificate_key /etc/nginx/certs/key.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_ciphers HIGH:!aNULL:!MD5;
  #
  #   # ... same location blocks as above ...
  # }
  #
  # # Redirect HTTP to HTTPS
  # server {
  #   listen 80;
  #   server_name _;
  #   return 301 https://$host$request_uri;
  # }
}