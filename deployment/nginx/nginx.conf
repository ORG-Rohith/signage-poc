events {}

http {
  server {
    listen 80;

    # Proxy everything to Next.js
    location / {
      proxy_pass http://nextjs-frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Static Next.js files
    location /_next/ {
      proxy_pass http://nextjs-frontend:3000;
      proxy_set_header Host $host;
    }

    # API routes (if used)
    location /api/ {
      proxy_pass http://nextjs-frontend:3000;
      proxy_set_header Host $host;
    }
  }
}