user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;

  # -----------------------------
  # Upstream services
  # -----------------------------
  upstream frontend {
    server signage-frontend:3000;
  }

  upstream backend {
    server signage-backend:3001;
  }

  # -----------------------------
  # HTTP → HTTPS Redirect
  # -----------------------------
  server {
    listen 80;
    server_name signagedigital.in www.signagedigital.in;

    return 301 https://$host$request_uri;
  }

  # -----------------------------
  # HTTPS Server
  # -----------------------------
  server {
    listen 443 ssl http2;
    server_name signagedigital.in www.signagedigital.in;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/signagedigital.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signagedigital.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_buffering off;

    # -----------------------------
    # Backend API
    # -----------------------------
    location /api/ {
      proxy_pass http://backend;
    }

    # -----------------------------
    # Uploads
    # -----------------------------
    location /uploads/ {
      proxy_pass http://backend;
    }

    # -----------------------------
    # WebSocket support
    # -----------------------------
    location /socket.io/ {
      proxy_pass http://backend;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_cache_bypass $http_upgrade;
    }

    # -----------------------------
    # Next.js static assets
    # -----------------------------
    location /_next/ {
      proxy_pass http://frontend;
      proxy_cache_bypass $http_upgrade;
    }

    location /public/ {
      proxy_pass http://frontend;
      proxy_cache_bypass $http_upgrade;
    }

    # -----------------------------
    # Health check
    # -----------------------------
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # -----------------------------
    # Frontend
    # -----------------------------
    location / {
      proxy_pass http://frontend;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # -----------------------------
    # Deny hidden files
    # -----------------------------
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

  }
}