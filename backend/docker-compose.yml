version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signage-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/signage_db
      PORT: 3001
    volumes:
      - uploads_volume:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fS", "http://localhost:3001/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - signage_net

  db:
    image: postgres:16-alpine
    container_name: signage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: signage_db
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signage_net

volumes:
  postgres_volume:
  uploads_volume:

networks:
  signage_net:
    driver: bridge