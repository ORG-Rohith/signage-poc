version: "3.9"

services:
  nextjs-frontend:
    image: nextjs-frontend
    container_name: nextjs-frontend
    restart: always
    networks:
      - signage-network
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs-frontend
    networks:
      - signage-network

networks:
  signage-network:
    driver: bridge