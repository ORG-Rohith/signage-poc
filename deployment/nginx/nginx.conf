# =============================
# Backup of previous config
# =============================
# The original server block and SSL config are preserved below for reference.
#
# server {
#   listen 80 default_server;
#   server_name _;
#   ...
# }
#
# # Optional HTTPS server block (uncomment and add certificates for SSL)
# # server {
# #   listen 443 ssl http2;
# #   server_name _;
# #   ssl_certificate /etc/nginx/certs/cert.pem;
# #   ssl_certificate_key /etc/nginx/certs/key.pem;
# #   ssl_protocols TLSv1.2 TLSv1.3;
# #   ssl_ciphers HIGH:!aNULL:!MD5;
# #   ...
# # }

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  # Main server block (HTTP, redirects to HTTPS)
  server {
    listen 80;
    server_name signagedigital.in www.signagedigital.in;
    return 301 https://$host$request_uri;

  # Upstream definitions
  upstream frontend {
    server signage-frontend:3000;
  }

  upstream backend {
    server signage-backend:3001;
  }
  }

  # =============================
  # HTTP server: Redirect all HTTP to HTTPS
  # =============================
  # HTTPS server block (SSL)
  server {
    listen 443 ssl http2;
    server_name signagedigital.in www.signagedigital.in;
    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
    ssl_certificate /etc/letsencrypt/live/signagedigital.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signagedigital.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  # =============================
  # HTTPS server: Handles all secure traffic
  # =============================
  server {
    listen 443 ssl http2;
    server_name signagedigital.in www.signagedigital.in;

    # SSL configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/signagedigital.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signagedigital.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;

    # Backend API routes — proxy to NestJS backend
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
    }

    # WebSocket support for Socket.IO (both frontend and backend)
    location ~ ^/(socket.io|ws) {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    # Uploads directory
    location /uploads/ {
      proxy_pass http://backend;
    }

    # Static Next.js assets
    location /_next/ {
      proxy_pass http://frontend;
      proxy_cache_bypass $http_upgrade;
    }

    # Next.js public directory
    location /public/ {
      proxy_pass http://frontend;
      proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint (for orchestrators)
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # Everything else to frontend (Next.js)
    location / {
      proxy_pass http://frontend;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Deny access to sensitive files
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }
  }
}